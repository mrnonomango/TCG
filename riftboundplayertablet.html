<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Riftbound Player Tablet · TCG Store</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071828;color:white;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}#screen{display:flex;flex-direction:column;min-height:100dvh}.half{flex:1;min-height:300px;background:linear-gradient(#17364f,#0c1d30);border:2px solid #327fb0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 12px}.top{transform:rotate(180deg)}.top .name{transform:rotate(180deg)}.meta{display:flex;gap:12px;justify-content:center;align-items:center;color:#b9dfff;font-weight:900;font-size:clamp(19px,2.8vh,29px);line-height:1.1;text-shadow:0 1px 4px #000}.timer{color:white}.lifeInfo{text-align:center}.lifeInfo small{display:block;color:#b1d6ef;font-weight:bold;font-size:10px}.lifeInfo strong{display:block;font-size:37px;line-height:1}.lifeStack{display:flex;flex-direction:column;gap:4px}.actionRow{display:flex;flex-direction:column;width:min(94%,540px);gap:5px}.actionRow button{width:100%;height:clamp(37px,5.5vh,55px);border:0;border-radius:9px;color:white;font-size:34px;font-weight:900}.plus{background:#187d48}.minus{background:#992e3d}.identity{display:flex;align-items:center;justify-content:center;gap:8px;width:min(94%,540px)}.name{min-width:0;width:53%;background:#f3f8fb;color:#152536;border:1px solid #5598bd;border-radius:7px;padding:8px;text-align:center;font-weight:bold}.leader{min-width:0;flex:1;background:#285a80;border:1px solid #6ca4c9;border-radius:7px;color:white;padding:9px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold}.games{display:flex;gap:9px;font-size:19px}.win{color:#6d859b}.win.active{color:#fff}.bottomRow{display:flex;gap:6px;width:min(94%,540px)}.bottomRow button{flex:1;border:0;border-radius:8px;padding:9px 2px;color:white;font-size:12px;font-weight:bold}.reset{background:#752b38}.gold{background:#bb984c;color:#171a20!important}.secondary{background:#36495b}#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#102a43;border:1px solid #569ac6;border-radius:8px;padding:10px 15px;color:white;font-size:13px;display:none;z-index:10;pointer-events:none}#picker{position:fixed;inset:0;z-index:30;background:#071828;display:none;flex-direction:column;padding:12px;gap:8px}#picker.open{display:flex}#picker iframe{flex:1;min-height:0;border:1px solid #4a8dbc;border-radius:7px}#back{align-self:flex-end;background:#365a78;color:white;border:0;border-radius:7px;padding:10px 18px}@media(max-height:650px){.half{min-height:275px;padding:4px 10px;gap:3px}.lifeInfo strong{font-size:29px}.actionRow button{height:32px}.bottomRow button{padding:6px}}

.battlefield{width:min(94%,540px);background:#285a80;border:1px solid #6ca4c9;border-radius:7px;color:white;padding:7px;font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta [data-round]{max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.half{min-height:350px}button:disabled,input:disabled{opacity:.5;cursor:default}@media(max-height:800px){.half{min-height:330px;padding:4px 10px;gap:2px}.meta{font-size:19px}.lifeInfo strong{font-size:24px}.lifeInfo small{font-size:9px}.lifeStack{gap:3px}.actionRow{gap:4px}.actionRow button{height:30px;font-size:28px}.identity input,.identity button{font-size:14px;padding:6px}.battlefield{padding:5px;font-size:11px}.games{font-size:16px}.bottomRow button{padding:5px 2px;font-size:11px}}
</style></head><body><div id="screen"></div><div id="status" role="status" aria-live="polite">Connecting…</div><div id="picker"><button id="back">Back to Tablet</button><iframe id="leaderFrame" title="Choose Riftbound card" src="about:blank"></iframe></div><script type="module">
import {getCard,remaining,formatTime} from './riftbounddata.js';
import {connectControls,bindText,cardPicker} from './riftboundcontrols.js';
const $=id=>document.getElementById(id);let state=null,app=null;
function section(n){return '<section class="half '+(n===2?'top':'')+'"><div class="meta"><span data-round>Round 1</span><span data-time>60:00</span></div><div class="lifeStack"><div class="lifeInfo"><small>OPPONENT’S POINTS</small><strong data-opp="'+n+'">0</strong></div><div class="lifeInfo"><small>YOUR POINTS</small><strong data-life="'+n+'">0</strong></div></div><div class="actionRow"><button data-match class="plus" data-adjust="'+n+'" data-delta="1">+</button><button data-match class="minus" data-adjust="'+n+'" data-delta="-1">−</button></div><div class="identity"><input data-match class="name" data-name="'+n+'" aria-label="Player '+n+' name" maxlength="80" value="Player '+n+'"><button data-match class="leader" data-legend="'+n+'">CHOOSE LEGEND ▾</button></div><button data-match class="battlefield" data-battlefield="'+n+'">CHOOSE BATTLEFIELD ▾</button><div class="games"><span class="win" data-icon="'+n+'-1">●</span><span class="win" data-icon="'+n+'-2">●</span></div><div class="bottomRow"><button data-match class="reset" data-reset-points="'+n+'">Reset Points</button><button data-match class="gold" data-win="'+n+'">Add Win</button><button data-match class="secondary" data-reset-wins="'+n+'">Reset Games</button></div></section>';}
$('screen').innerHTML=section(2)+section(1);
function ready(value){document.querySelectorAll('[data-match]').forEach(el=>el.disabled=!value);}
function tick(){if(state)document.querySelectorAll('[data-time]').forEach(el=>el.textContent=formatTime(remaining(state)));}
function render(s){state=s;for(const n of [1,2]){const prefix='player'+n+'_';document.querySelector('[data-life="'+n+'"]').textContent=s[prefix+'points'];document.querySelector('[data-opp="'+n+'"]').textContent=s['player'+(n===1?2:1)+'_points'];const input=document.querySelector('[data-name="'+n+'"]');if(document.activeElement!==input)input.value=s[prefix+'name'];for(let i=1;i<=2;i++)document.querySelector('[data-icon="'+n+'-'+i+'"]').classList.toggle('active',s[prefix+'wins']>=i);for(const [field,kind]of [['legend','Legend'],['battlefield','Battlefield']]){const b=document.querySelector('[data-'+field+'="'+n+'"]'),card=getCard(s[prefix+field],kind);b.textContent=card?card.name+' ▾':'CHOOSE '+kind.toUpperCase()+' ▾';b.title=card?.name||'Choose '+kind;}}document.querySelectorAll('[data-round]').forEach(el=>el.textContent=s.round_name);tick();}
ready(false);app=connectControls({render,ready,status:text=>{$('status').textContent=text;$('status').style.display=/^(Connected|Saving)/.test(text)?'none':'block';}});
const picker=cardPicker({frame:$('leaderFrame'),container:$('picker'),back:$('back'),onSelect:({player,kind,code})=>app.change({['player'+player+'_'+(kind==='Legend'?'legend':'battlefield')]:code})});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!app.ready)return;let n=Number(b.dataset.adjust);if(n){app.score('player'+n+'_points',Number(b.dataset.delta));return;}n=Number(b.dataset.resetPoints);if(n){app.change({['player'+n+'_points']:0});return;}n=Number(b.dataset.win);if(n){app.score('player'+n+'_wins',1);return;}n=Number(b.dataset.resetWins);if(n){app.change({['player'+n+'_wins']:0});return;}n=Number(b.dataset.legend);if(n){picker.open(n,'Legend');return;}n=Number(b.dataset.battlefield);if(n)picker.open(n,'Battlefield');});
for(const n of [1,2])bindText(app,document.querySelector('[data-name="'+n+'"]'),'player'+n+'_name');setInterval(tick,250);document.addEventListener('visibilitychange',tick);
</script></body></html>
