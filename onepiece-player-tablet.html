<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>One Piece Player Tablet · TCG Store</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071828;color:white;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}#screen{display:flex;flex-direction:column;min-height:100dvh}.half{flex:1;min-height:300px;background:linear-gradient(#17364f,#0c1d30);border:2px solid #327fb0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 12px}.top{transform:rotate(180deg)}.top .name{transform:rotate(180deg)}.meta{display:flex;gap:12px;justify-content:center;align-items:center;color:#b9dfff;font-weight:900;font-size:clamp(19px,2.8vh,29px);line-height:1.1;text-shadow:0 1px 4px #000}.timer{color:white}.lifeInfo{text-align:center}.lifeInfo small{display:block;color:#b1d6ef;font-weight:bold;font-size:10px}.lifeInfo strong{display:block;font-size:37px;line-height:1}.lifeStack{display:flex;flex-direction:column;gap:4px}.actionRow{display:flex;flex-direction:column;width:min(94%,540px);gap:5px}.actionRow button{width:100%;height:clamp(37px,5.5vh,55px);border:0;border-radius:9px;color:white;font-size:34px;font-weight:900}.plus{background:#187d48}.minus{background:#992e3d}.identity{display:flex;align-items:center;justify-content:center;gap:8px;width:min(94%,540px)}.name{min-width:0;width:53%;background:#f3f8fb;color:#152536;border:1px solid #5598bd;border-radius:7px;padding:8px;text-align:center;font-weight:bold}.leader{min-width:0;flex:1;background:#285a80;border:1px solid #6ca4c9;border-radius:7px;color:white;padding:9px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold}.games{display:flex;gap:9px;font-size:19px}.win{color:#6d859b}.win.active{color:#fff}.bottomRow{display:flex;gap:6px;width:min(94%,540px)}.bottomRow button{flex:1;border:0;border-radius:8px;padding:9px 2px;color:white;font-size:12px;font-weight:bold}.reset{background:#752b38}.gold{background:#bb984c;color:#171a20!important}.secondary{background:#36495b}#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#102a43;border:1px solid #569ac6;border-radius:8px;padding:10px 15px;color:white;font-size:13px;display:none;z-index:10;pointer-events:none}#picker{position:fixed;inset:0;z-index:30;background:#071828;display:none;flex-direction:column;padding:12px;gap:8px}#picker.open{display:flex}#picker iframe{flex:1;min-height:0;border:1px solid #4a8dbc;border-radius:7px}#back{align-self:flex-end;background:#365a78;color:white;border:0;border-radius:7px;padding:10px 18px}@media(max-height:650px){.half{min-height:275px;padding:4px 10px;gap:3px}.lifeInfo strong{font-size:29px}.actionRow button{height:32px}.bottomRow button{padding:6px}}
</style></head><body><div id="screen"></div><div id="status">Connecting…</div><div id="picker"><button id="back">Back to Tablet</button><iframe id="leaderFrame" title="Choose One Piece leader" src="about:blank"></iframe></div>
<script type="module">
import {onepieceRef,onepieceDefaults,onValue,update,runTransaction,requireLogin} from './firebase.js';
const $=id=>document.getElementById(id);
await requireLogin();

let state=null,version=0,busy=false,inFlight=false,choosing=0,connected=false;
const fields=(n)=>({life:"player"+n+"_life",name:"player"+n+"_name",wins:"player"+n+"_wins",leader:"player"+n+"_leader"});
function section(n){return '<section class="half '+(n===2?'top':'')+'"><div class="meta"><span data-round>ROUND 1</span><span data-time>60:00</span></div><div class="lifeStack"><div class="lifeInfo"><small>OPPONENT’S LIFE</small><strong data-opp="'+n+'">5</strong></div><div class="lifeInfo"><small>YOUR LIFE</small><strong data-life="'+n+'">5</strong></div></div><div class="actionRow"><button class="plus" data-adjust="'+n+'" data-delta="1">+</button><button class="minus" data-adjust="'+n+'" data-delta="-1">−</button></div><div class="identity"><input class="name" data-name="'+n+'" aria-label="Player '+n+' name" maxlength="80" value="Player '+n+'"><button class="leader" data-leader="'+n+'">CHOOSE LEADER ▾</button></div><div class="games"><span class="win" data-icon="'+n+'-1">☠</span><span class="win" data-icon="'+n+'-2">☠</span></div><div class="bottomRow"><button class="reset" data-reset-life="'+n+'">Reset Life</button><button class="gold" data-win="'+n+'">Add Win</button><button class="secondary" data-reset-wins="'+n+'">Reset Games</button></div></section>';}
$("screen").innerHTML=section(2)+section(1);
function message(t){$("status").textContent=t;$("status").style.display=t?"block":"none"}
function seconds(){if(!state)return 3600;return Math.max(0,state.timer_remaining_seconds-(state.timer_running&&state.timer_started_at?Math.floor((Date.now()-state.timer_started_at)/1000):0))}
function time(){const n=seconds();document.querySelectorAll("[data-time]").forEach(e=>e.textContent=Math.floor(n/60)+":"+String(n%60).padStart(2,"0"))}
function render(){if(!state)return;for(const n of [1,2]){const f=fields(n),other=fields(n===1?2:1);document.querySelector('[data-life="'+n+'"]').textContent=state[f.life];document.querySelector('[data-opp="'+n+'"]').textContent=state[other.life];const input=document.querySelector('[data-name="'+n+'"]');if(document.activeElement!==input)input.value=state[f.name];for(let i=1;i<=2;i++)document.querySelector('[data-icon="'+n+'-'+i+'"]').classList.toggle("active",state[f.wins]>=i);document.querySelector('[data-leader="'+n+'"]').textContent=state[f.leader]?.name||"CHOOSE LEADER ▾";}document.querySelectorAll("[data-round]").forEach(e=>e.textContent=state.round_name||"Round 1");time();}
async function change(changes){if(!state||busy)return;busy=true;try{await update(onepieceRef,changes);message('');}catch(e){message('Could not save. Check your connection.');}finally{busy=false;}}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!state)return;let n=Number(b.dataset.adjust);if(n){const f=fields(n).life;change({[f]:Math.max(0,Math.min(20,state[f]+Number(b.dataset.delta)))});return;}n=Number(b.dataset.resetLife);if(n){change({[fields(n).life]:5});return;}n=Number(b.dataset.win);if(n){const f=fields(n).wins;change({[f]:Math.min(2,state[f]+1)});return;}n=Number(b.dataset.resetWins);if(n){change({[fields(n).wins]:0});return;}n=Number(b.dataset.leader);if(n){choosing=n;$("picker").classList.add("open");$("leaderFrame").src="./onepiece-leader-picker.html";}});
for(const n of [1,2]){const input=document.querySelector('[data-name="'+n+'"]');input.addEventListener("change",()=>change({[fields(n).name]:input.value.trim()||"Player "+n}));input.addEventListener("blur",()=>{if(!input.value.trim())input.value="Player "+n})}
$("back").onclick=()=>{$("picker").classList.remove("open");$("leaderFrame").src="about:blank"};
window.addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==$("leaderFrame").contentWindow||e.data?.type!=="tcgstore:onepiece-leader-selected")return;const n=choosing;$("picker").classList.remove("open");$("leaderFrame").src="about:blank";change({[fields(n).leader]:e.data.card});});
setInterval(time,250);
onValue(onepieceRef,s=>{state={...onepieceDefaults,...s.val()};render();message('');},()=>message('Connection unavailable'));
</script></body></html>
