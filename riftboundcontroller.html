<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riftbound Staff Controller · TCG Store</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px 12px 35px;background:#09131f;color:#fff;font-family:Arial,sans-serif}main{max-width:650px;margin:auto}
h1{text-align:center;font-size:22px;color:#7dcaff;margin:6px 0}header p{text-align:center;font-size:12px;color:#a5b9ce;margin:5px 0 15px}
.panel,.section{background:linear-gradient(#1a344c,#101d30);border:2px solid #32668d;border-radius:13px;padding:14px;margin:12px 0}
.panel h2{margin:0 0 11px;color:#a8daff;font-size:19px}.row{display:grid;grid-template-columns:1.5fr 1fr;gap:9px;margin:10px 0}label{display:block;color:#cad9e7;font-size:12px;font-weight:bold;margin:7px 0 5px}
input,select{min-width:0;width:100%;padding:11px 10px;border:1px solid #537997;border-radius:8px;font-size:16px;background:#f4f7fa;color:#122334}
button{cursor:pointer;touch-action:manipulation;font:700 15px Arial;border:0;border-radius:8px;padding:11px;color:white;background:#295c80}
button:disabled{opacity:.45;cursor:not-allowed}.leader{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#214968;border:1px solid #528db5}
.leader img{width:40px;height:55px;object-fit:contain}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.controls>div{text-align:center}
.value{font-size:34px;font-weight:900}.buttons{display:flex;gap:6px}.buttons button{flex:1;font-size:24px}.plus{background:#207b4f}.minus{background:#96313a}.win{background:#c49b41;color:#131313;width:100%}
.dots{color:#d8e9f3;margin:4px 0 12px;letter-spacing:9px;font-size:19px}
.section h2{font-size:18px;color:#91d4ff;margin:0 0 12px}.timer{font-size:43px;font-weight:900;text-align:center;margin:9px}.timerButtons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
#status{color:#cee0f1;text-align:center;min-height:20px;margin:10px 0}.warn{color:#ffb1a8!important}
#picker{display:none;position:fixed;inset:0;z-index:100;background:#05101af5;padding:12px}
#picker.open{display:flex;flex-direction:column;gap:10px}
#picker iframe{flex:1;width:100%;border:1px solid #487fa7;border-radius:8px;background:#071828}
#pickerClose{align-self:flex-end;background:#84363d}
.themeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.theme{background:#122235;border:2px solid #355b7b;padding:8px;font-size:12px}
.theme.active{border-color:#b1e2ff}.swatches{display:flex;height:25px;gap:1px;margin-bottom:5px}.swatches i{flex:1}

h1{color:#cfb579}.battlefieldButton img{width:55px;height:40px}#status{position:sticky;top:0;z-index:5;background:#09131ff5;padding:8px;border-radius:7px}.leader{min-height:49px}
</style></head><body><main>
<header><h1>RIFTBOUND STREAM CONTROL</h1><p>Tournament Staff Controller · TCG Store</p></header><div id="status" role="status" aria-live="polite">Connecting to Riftbound…</div><div id="players"></div>
<section class="section"><h2>Match Controls</h2><div class="buttons"><button data-match id="resetPoints">Reset Both Points</button><button data-match id="resetWins">Reset Games</button></div>
<label for="round">Round</label><input data-match id="round" maxlength="100" value="Round 1"><div class="timer" id="timer">60:00</div><label for="minutes">Set Timer Minutes</label><input data-match id="minutes" type="number" inputmode="numeric" min="0" max="999" value="60"><div class="timerButtons"><button data-match id="start" class="plus">Start</button><button data-match id="pause">Pause</button><button data-match id="resetTimer" class="minus">Reset</button></div><button data-match id="applyMinutes" style="width:100%">Apply Minutes</button></section>
<section class="section"><h2>Overlay Appearance</h2><div id="themes" class="themeGrid"></div></section><div id="picker"><button id="pickerClose">Back to Controller</button><iframe title="Choose Riftbound card" id="pickerFrame" src="about:blank"></iframe></div>
</main><script type="module">
import {regularCard} from './riftboundregularcards.js';
import {getCard,themes,remaining,formatTime} from './riftbounddata.js';
import {connectControls,bindText,cardPicker} from './riftboundcontrols.js';
const $=id=>document.getElementById(id);let state=null,app=null,minutesDirty=false;
for(const p of [2,1]){const section=document.createElement('section');section.className='panel';section.innerHTML='<h2>PLAYER '+p+' <span style="float:right">POINTS <span id="v'+p+'" class="value">0</span></span></h2><div class="row"><div><label for="name'+p+'">Player Name</label><input data-match id="name'+p+'" maxlength="80"></div><div><label for="record'+p+'">W-L-D</label><input data-match id="record'+p+'" maxlength="11" placeholder="0-0-0"></div></div><label>Legend (Champion)</label><button data-match class="leader" id="legend'+p+'">Search and select a Legend</button><label>Battlefield</label><button data-match class="leader battlefieldButton" id="battlefield'+p+'">Search and select a battlefield</button><label>Featured Card (full card image)</label><button data-match class="leader" id="regular'+p+'">Search and select a regular card</button><div class="controls"><div><label>ADJUST POINTS</label><div class="buttons"><button data-match class="minus" id="down'+p+'">−</button><button data-match class="plus" id="up'+p+'">+</button></div></div><div><label>GAME WINS</label><div class="dots" id="dots'+p+'">○ ○</div><button data-match class="win" id="win'+p+'">+ Game Win</button></div></div>'; $('players').append(section);}
for(const[id,name,base,primary,accent]of themes){const b=document.createElement('button');b.className='theme';b.dataset.theme=id;b.dataset.match='';b.innerHTML='<span class="swatches"><i style="background:'+base+'"></i><i style="background:'+primary+'"></i><i style="background:'+accent+'"></i></span>'+name;b.onclick=()=>app.change({theme:id});$('themes').append(b);}
function ready(value){document.querySelectorAll('[data-match]').forEach(el=>el.disabled=!value);if(value&&state){$('start').disabled=state.timer_running||remaining(state)===0;$('pause').disabled=!state.timer_running;}}
function setCard(button,code,kind){if(button.dataset.card===(code||''))return;button.dataset.card=code||'';button.replaceChildren();const card=getCard(code,kind);if(card){const img=document.createElement('img');img.src=card.imageUrl;img.alt='';img.onerror=()=>img.remove();button.append(img,document.createTextNode(card.name+' · Change'));}else button.textContent='Search and select a '+kind.toLowerCase();}
async function setRegular(button,code){if(button.dataset.card===(code||''))return;button.dataset.card=code||'';button.textContent=code?'Loading '+code+'…':'Search and select a regular card';if(!code)return;try{const card=await regularCard(code);if(button.dataset.card!==code)return;if(!card){button.textContent=code+' · Change';return;}const img=document.createElement('img');img.src=card.imageUrl;img.alt='';img.onerror=()=>img.remove();button.replaceChildren(img,document.createTextNode(card.name+' · Change'));}catch{if(button.dataset.card===code)button.textContent=code+' · Change';}}
function tick(){if(!state)return;$('timer').textContent=formatTime(remaining(state));ready(app?.ready||false);}
function render(s){state=s;for(const p of [1,2]){for(const field of ['name','record']){const input=$(field+p);if(document.activeElement!==input)input.value=s['player'+p+'_'+field];}$('v'+p).textContent=s['player'+p+'_points'];const wins=s['player'+p+'_wins'];$('dots'+p).textContent=(wins>=1?'●':'○')+'  '+(wins>=2?'●':'○');setCard($('legend'+p),s['player'+p+'_legend'],'Legend');setCard($('battlefield'+p),s['player'+p+'_battlefield'],'Battlefield');setRegular($('regular'+p),s['player'+p+'_regular']);}if(document.activeElement!==$('round'))$('round').value=s.round_name;if(!minutesDirty&&document.activeElement!==$('minutes'))$('minutes').value=s.timer_duration_seconds/60;document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===s.theme));tick();}
ready(false);app=connectControls({render,ready,status:(text,error)=>{$('status').textContent=text;$('status').classList.toggle('warn',error);}});
const picker=cardPicker({frame:$('pickerFrame'),container:$('picker'),back:$('pickerClose'),onSelect:({player,kind,code})=>app.change({['player'+player+'_'+(kind==='Legend'?'legend':kind==='Battlefield'?'battlefield':'regular')]:code})});
for(const p of [1,2]){$('up'+p).onclick=()=>app.score('player'+p+'_points',1);$('down'+p).onclick=()=>app.score('player'+p+'_points',-1);$('win'+p).onclick=()=>app.score('player'+p+'_wins',1);$('legend'+p).onclick=()=>picker.open(p,'Legend');$('battlefield'+p).onclick=()=>picker.open(p,'Battlefield');$('regular'+p).onclick=()=>picker.open(p,'Regular');bindText(app,$('name'+p),'player'+p+'_name');bindText(app,$('record'+p),'player'+p+'_record',{debounce:false});}
bindText(app,$('round'),'round_name');$('resetPoints').onclick=()=>app.change({player1_points:0,player2_points:0});$('resetWins').onclick=()=>app.change({player1_wins:0,player2_wins:0});$('start').onclick=()=>app.timer('start');$('pause').onclick=()=>app.timer('pause');$('resetTimer').onclick=()=>app.timer('reset');$('minutes').addEventListener('input',()=>minutesDirty=true);async function applyMinutes(){if(await app.timer('set',$('minutes').value))minutesDirty=false;}$('applyMinutes').onclick=applyMinutes;$('minutes').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyMinutes();}});setInterval(tick,250);document.addEventListener('visibilitychange',tick);
</script></body></html>
