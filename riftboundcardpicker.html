<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riftbound Card Search · TCG Store</title><style>
*{box-sizing:border-box}body{margin:0;background:#091b31;color:white;padding:16px;font:16px Arial}main{max-width:1000px;margin:auto}h1{font-size:22px;color:#cfb579}input{width:100%;padding:13px;font:inherit;border-radius:7px;border:1px solid #567daf}button{cursor:pointer;padding:11px 15px;border:1px solid #5d89b3;border-radius:7px;background:#204f7c;color:white;font:700 15px Arial;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #cfb579;outline-offset:3px}button:disabled{opacity:.4;cursor:default}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:18px 0}.card{padding:8px}.card img{display:block;width:100%;aspect-ratio:744/1039;object-fit:contain}.battlefields .card img{aspect-ratio:1039/744}.card span{display:block;margin-top:6px;font-size:13px}.card small{display:block;color:#b4cadb;margin-top:5px}.actions{display:flex;justify-content:space-between;gap:10px;margin:15px 0}#status{min-height:22px;color:#d3e5f9}a{color:#9ed5ff}
</style></head><body><main><h1 id="title">Choose a Legend</h1><input id="query" type="search" placeholder="Start typing a name…" maxlength="100" aria-label="Search cards"><div class="actions"><button id="clear" type="button">Leave slot empty</button><a href="https://playriftbound.com/en-us/card-gallery/" target="_blank" rel="noopener">Official card gallery</a></div><p id="status" role="status" aria-live="polite"></p><div id="cards"></div><div class="actions"><button id="prev" disabled>Previous</button><button id="next" disabled>Next</button></div><small>Card artwork © Riot Games. Unofficial fan tool.</small></main><script type="module">
import {cardCatalog} from './riftboundcatalog.js';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),kind=params.get('kind')==='Battlefield'?'Battlefield':'Legend',request=params.get('request');let page=0;const pageSize=24;
$('title').textContent='Choose a '+kind;$('query').placeholder=kind==='Legend'?'Search a champion or Legend name…':'Search a battlefield name…';document.body.classList.toggle('battlefields',kind==='Battlefield');
function choose(code){if(parent===window){$('status').textContent='Open this picker from the staff or player tablet controller.';return;}parent.postMessage({type:'tcgstore:riftbound-card-selected',kind,request,code},location.origin);}
function render(){const term=$('query').value.trim().toLowerCase();const matches=cardCatalog.filter(c=>c.type===kind&&(c.name+' '+c.code).toLowerCase().includes(term));const pages=Math.max(1,Math.ceil(matches.length/pageSize));page=Math.min(page,pages-1);$('cards').replaceChildren();for(const card of matches.slice(page*pageSize,(page+1)*pageSize)){const b=document.createElement('button');b.type='button';b.className='card';const img=document.createElement('img');img.loading='lazy';img.src=card.imageUrl;img.alt='';img.onerror=()=>img.remove();const name=document.createElement('span');name.textContent=card.name;const code=document.createElement('small');code.textContent=card.code;b.append(img,name,code);b.onclick=()=>choose(card.code);$('cards').append(b);}$('status').textContent=matches.length?matches.length+' cards · Page '+(page+1)+' of '+pages:'No matching cards. Try another name.';$('prev').disabled=page===0;$('next').disabled=page===pages-1;}
$('query').addEventListener('input',()=>{page=0;render();});$('query').addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault();});$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('clear').onclick=()=>choose(null);render();
</script></body></html>
