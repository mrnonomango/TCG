<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon OBS Overlay · TCG Store</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
:root{--base:#071b45;--primary:#2357a6;--accent:#ffcf33}
#viewport{width:100vw;height:100vh;overflow:hidden;position:relative}.scene{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;background:transparent}
.side{position:absolute;top:0;width:240px;height:1080px;background:linear-gradient(180deg,var(--primary),var(--base) 95%);border:3px solid var(--accent);box-shadow:inset 0 0 0 8px #061625;color:white;text-align:center;overflow:hidden}.side.left{left:0}.side.right{right:0}
.camera{height:314px;border-bottom:3px solid var(--accent)}
/* The content area between the camera and bottom logo is evenly distributed. */
.playerInfo{position:absolute;top:329px;bottom:24px;left:10px;right:10px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;min-height:0}
.name{font-size:23px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;line-height:31px;text-shadow:0 2px 4px #000}
.record{font-size:21px;line-height:28px;color:#b3d6ec;font-weight:800}
.wins{display:flex;justify-content:center;gap:8px;height:48px;align-items:center}.win{display:block;width:48px;height:48px;object-fit:contain;opacity:.32;transition:opacity .15s}.win.won{opacity:1}
.lifeGroup{display:flex;flex-direction:column;align-items:center;gap:1px}.lifeLabel{font-weight:900;letter-spacing:3px;font-size:21px;color:#cce9fb}.lifeValue{font-size:77px;line-height:1.05;font-weight:900;color:#fff;text-shadow:0 3px 8px #000,0 0 13px var(--accent)}
.leader{display:flex;align-items:center;justify-content:center;width:180px;height:251px;border:0;background:transparent;flex-shrink:0}.leader img{width:100%;height:100%;object-fit:contain}
.logo{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:210px;height:85px;object-fit:contain;}
.timerBox{position:absolute;top:3px;left:50%;transform:translateX(-50%);min-width:185px;height:74px;background:linear-gradient(var(--primary),var(--base));border:2px solid var(--accent);border-radius:6px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 1px 6px #000}.round{font-size:21px;font-weight:800;max-width:400px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:36px;font-weight:900;line-height:1}
#status{position:absolute;left:50%;top:114px;transform:translateX(-50%);padding:9px 15px;border:1px solid var(--accent);border-radius:7px;background:#071828;color:#fff;font-size:16px;display:none}
.prizeCards{display:flex;gap:5px;margin-top:5px}.prizeCard{width:25px;height:35px;border:2px solid #ffcf33;border-radius:3px;background:#133469 url('./pokemonassets/pokeball.svg') center / 21px 21px no-repeat;opacity:.15}.prizeCard.remaining{opacity:1}.lifeValue{font-size:64px}.lifeLabel{font-size:17px;letter-spacing:1px}
.playerInfo{top:329px;bottom:24px;gap:0;justify-content:space-between}
.playerInfo>.name,.playerInfo>.record,.playerInfo>.wins,.playerInfo>.lifeGroup,.playerInfo>.leader,.playerInfo>.logo{flex-shrink:0}
.playerInfo>.logo{position:static;left:auto;bottom:auto;transform:none;width:210px;height:85px}
</style></head><body><div id="viewport"><div id="scene" class="scene">
<section class="side left"><div class="camera"></div><div class="playerInfo"><div class="name" id="name1">Player 1</div><div class="record" id="record1">0-0-0</div><div class="wins"><img class="win" id="win11" src="./pokemonassets/pokeball.svg" alt="Game win 1"><img class="win" id="win12" src="./pokemonassets/pokeball.svg" alt="Game win 2"></div><div class="lifeGroup"><div class="lifeLabel">PRIZES LEFT</div><div class="lifeValue" id="life1">6</div><div class="prizeCards" id="prizes1" aria-label="Six Prize cards remaining"><span class="prizeCard remaining" aria-hidden="true"></span><span class="prizeCard remaining" aria-hidden="true"></span><span class="prizeCard remaining" aria-hidden="true"></span><span class="prizeCard remaining" aria-hidden="true"></span><span class="prizeCard remaining" aria-hidden="true"></span><span class="prizeCard remaining" aria-hidden="true"></span></div></div><div class="leader" id="leader1"></div><img class="logo" src="./pokemonassets/pokemonlogotransparent.png" alt="Pokémon Card Game"></div></section>
<section class="side right"><div class="camera"></div><div class="playerInfo"><div class="name" id="name2">Player 2</div><div class="record" id="record2">0-0-0</div><div class="wins"><img class="win" id="win21" src="./pokemonassets/pokeball.svg" alt="Game win 1"><img class="win" id="win22" src="./pokemonassets/pokeball.svg" alt="Game win 2"></div><div class="lifeGroup"><div class="lifeLabel">PRIZES LEFT</div><div class="lifeValue" id="life2">6</div><div class="prizeCards" id="prizes2" aria-label="Six Prize cards remaining"><span class="prizeCard remaining" aria-hidden="true"></span><span class="prizeCard remaining" aria-hidden="true"></span><span class="prizeCard remaining" aria-hidden="true"></span><span class="prizeCard remaining" aria-hidden="true"></span><span class="prizeCard remaining" aria-hidden="true"></span><span class="prizeCard remaining" aria-hidden="true"></span></div></div><div class="leader" id="leader2"></div><img class="logo" src="./pokemonassets/pokemonlogotransparent.png" alt="Pokémon Card Game"></div></section>
<div class="timerBox"><div class="round" id="round">Round 1</div><div class="time" id="time">60:00</div></div><div id="status"></div>
</div></div><script type="module">
import {pokemonRef,pokemonDefaults,onValue,update,runTransaction,adjustScore,safeCard} from './pokemondata.js';
const $=id=>document.getElementById(id);

const themes={"classic":["#071b45","#2357a6","#ffcf33"],"deep-ocean":["#071828","#115a96","#3196d3"],"blood-red":["#1b090d","#801b29","#d33d4d"],"black-gold":["#101114","#343236","#d6a43a"],"dark-emerald":["#071d19","#145d48","#31a47b"],"imperial-purple":["#170d26","#492573","#9864c4"],"gunmetal":["#0d141a","#303f4c","#8aa2b4"]};
let state=null,inFlight=false;
function fit(){const scale=Math.min(innerWidth/1920,innerHeight/1080);$("scene").style.transform="translate("+((innerWidth-1920*scale)/2)+"px,"+((innerHeight-1080*scale)/2)+"px) scale("+scale+")"}addEventListener("resize",fit);fit();
function status(s){$("status").textContent=s;$("status").style.display=s?"block":"none"}
function cardImage(url){return url;}
function setCardImage(img,url){const primary=cardImage(url);img.referrerPolicy="no-referrer";img.onerror=()=>{if(img.dataset.fallback){img.src=img.dataset.fallback;img.dataset.fallback="";}else{img.style.display="none"}};img.dataset.fallback=primary!==url?url:"";img.style.display="block";img.src=primary}
function render(){if(!state)return;const cols=themes[state.theme]||themes["classic"];["--base","--primary","--accent"].forEach((k,i)=>document.documentElement.style.setProperty(k,cols[i]));for(const n of [1,2]){$("name"+n).textContent=state["player"+n+"_name"]||"Player "+n;$("record"+n).textContent=state["player"+n+"_record"]||"0-0-0";$("life"+n).textContent=state["player"+n+"_prizes"]??6;const prizeCount=Math.max(0,Math.min(6,Number(state["player"+n+"_prizes"])||0));$("prizes"+n).setAttribute("aria-label",prizeCount+" Prize cards remaining");$("prizes"+n).querySelectorAll(".prizeCard").forEach((card,i)=>card.classList.toggle("remaining",i<prizeCount));for(let i=1;i<=2;i++)$("win"+n+i).classList.toggle("won",(state["player"+n+"_wins"]||0)>=i);const slot=$("leader"+n);const leader=safeCard(state["player"+n+"_card"]);if(leader?.image){const existing=slot.querySelector("img");if(!existing||existing.dataset.cardUrl!==leader.image){const image=document.createElement("img");image.dataset.cardUrl=leader.image;image.alt=leader.name||"Selected Card";setCardImage(image,leader.image);slot.replaceChildren(image);}}else if(slot.childNodes.length)slot.replaceChildren();}$("round").textContent=state.round_name||"Round 1";timer()}
function timer(){if(!state)return;const elapsed=state.timer_running&&state.timer_started_at?Math.max(0,Math.floor((Date.now()-state.timer_started_at)/1000)):0;const n=Math.max(0,(state.timer_remaining_seconds||0)-elapsed);$("time").textContent=Math.floor(n/60)+":"+String(n%60).padStart(2,"0")}
setInterval(timer,250);
onValue(pokemonRef,s=>{state={...pokemonDefaults,...s.val()};render();status('');},()=>status('Waiting for connection…'));
</script></body></html>
