<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Card Search · TCG Store</title><style>
*{box-sizing:border-box}body{margin:0;background:#091b31;color:white;padding:16px;font:16px Arial}main{max-width:1000px;margin:auto}h1{font-size:22px;color:#ffcf33}form{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px;font:inherit;border-radius:7px;border:1px solid #567daf}button{cursor:pointer;padding:11px 15px;border:1px solid #5d89b3;border-radius:7px;background:#204f7c;color:white;font:700 15px Arial;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #ffcf33;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:18px 0}.card{padding:8px}.card img{display:block;width:100%;aspect-ratio:600/825;object-fit:contain}.card span{display:block;margin-top:6px;font-size:12px}.actions{display:flex;justify-content:space-between;gap:10px;margin:15px 0}#status{min-height:22px;color:#d3e5f9}a{color:#9ed5ff}</style></head><body><main>
<h1>Choose a Pokémon Card</h1><form id="search"><input id="query" type="search" placeholder="Search a card name, e.g. Charizard" maxlength="80" aria-label="Pokémon card name" required><button id="searchButton">Search</button></form>
<div class="actions"><button id="clear" type="button">Leave card slot empty</button><a href="https://tcgdex.net/" target="_blank" rel="noopener">Card data: TCGdex</a></div><p id="status" role="status" aria-live="polite">Start typing a card name to search.</p><div id="cards"></div><div class="actions"><button id="prev" disabled>Previous</button><button id="next" disabled>Next</button></div>
</main><script>
const $=id=>document.getElementById(id);let page=1,term='',request,debounce,searchVersion=0;
function choose(card){if(parent!==window)parent.postMessage({type:'tcgstore:pokemon-card-selected',card},location.origin);else $('status').textContent='Open card search from the staff or tablet controller to select a card.';}
$('clear').onclick=()=>choose(null);
async function search(){if(!term)return;request?.abort();request=new AbortController();const version=++searchVersion;const signal=request.signal;$('searchButton').disabled=true;$('prev').disabled=true;$('next').disabled=true;$('status').textContent='Searching…';$('cards').replaceChildren();
try{const url=new URL('https://api.tcgdex.net/v2/en/cards');url.searchParams.set('name',term);url.searchParams.set('pagination:page',page);url.searchParams.set('pagination:itemsPerPage',30);const response=await fetch(url,{signal});if(!response.ok)throw Error('Search unavailable');const cards=await response.json();if(version!==searchVersion)return;if(!Array.isArray(cards))throw Error('Invalid response');let count=0;
for(const card of cards){if(typeof card.image!=='string'||!card.image.startsWith('https://assets.tcgdex.net/'))continue;count++;const b=document.createElement('button');b.className='card';b.type='button';const img=document.createElement('img');img.loading='lazy';img.src=card.image+'/low.webp';img.alt=card.name+' · '+card.id;img.onerror=()=>{img.remove();b.disabled=true;};const name=document.createElement('span');name.textContent=card.name+' · '+card.id;b.append(img,name);b.onclick=()=>choose({id:card.id,name:card.name,image:card.image+'/high.webp'});$('cards').append(b);}
$('status').textContent=count?'Page '+page+' · Select a card.':'No cards with images found. Try another name.';$('prev').disabled=page===1;$('next').disabled=cards.length<30;
}catch(e){if(version===searchVersion&&e.name!=='AbortError')$('status').textContent='Card search is unavailable. Try Search again in a moment.';}finally{if(version===searchVersion)$('searchButton').disabled=false;}}
function startQuery(){
  clearTimeout(debounce);request?.abort();searchVersion++;
  term=$('query').value.trim();page=1;
  $('cards').replaceChildren();$('prev').disabled=true;$('next').disabled=true;$('searchButton').disabled=false;
  if(!term){$('status').textContent='Start typing a card name to search.';return;}
  search();
}
$('query').addEventListener('input',()=>{
  clearTimeout(debounce);request?.abort();searchVersion++;
  $('cards').replaceChildren();$('prev').disabled=true;$('next').disabled=true;$('searchButton').disabled=false;
  if(!$('query').value.trim()){$('status').textContent='Start typing a card name to search.';return;}
  $('status').textContent='Searching…';debounce=setTimeout(startQuery,300);
});
$('search').onsubmit=e=>{e.preventDefault();startQuery();};$('prev').onclick=()=>{if(page>1){page--;search()}};$('next').onclick=()=>{page++;search()};
</script></body></html>
