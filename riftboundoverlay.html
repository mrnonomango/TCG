html,body,#scene{background:transparent}.camera{background:transparent}.champion,.battlefield{cursor:default}.empty{visibility:hidden}.backdrop{position:absolute;inset:0;pointer-events:none}.timerBox{background:linear-gradient(var(--primary),var(--base));border-color:var(--accent)}.timerBox .round{max-width:156px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.champion,.battlefield{border-color:var(--accent)}.player .championName{background:var(--base);border-color:var(--accent)}.player .championArt.cutout{background:linear-gradient(var(--primary),var(--base))}#connection{position:absolute;left:18px;bottom:18px;max-width:265px;padding:8px;color:#fff;background:#101d2ce8;border:1px solid #cfb579;border-radius:5px;font-size:13px}:root{--base:#080d16;--primary:#142232;--accent:#cfb579}
 .featuredCard{width:172px;height:241px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:6px}.featuredCard img{display:block;width:100%;height:100%;object-fit:contain}.featuredCard.empty{visibility:hidden}.player{gap:10px}

/* Final narrow broadcast panels; outside areas remain transparent. */
.player{top:0;width:240px;height:1080px;gap:10px;padding:0 9px 18px;background:linear-gradient(180deg,var(--primary),var(--base));border:2px solid var(--accent)}

/* Balanced side panel spacing while retaining fixed OBS camera slots. */
.player{justify-content:space-between;padding-bottom:36px;gap:0}

.scoreLabel.left{left:260px}.scoreLabel.right{right:260px}

</style></head><body><div id="viewport"><div id="scene"><svg class="backdrop" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true"><defs><linearGradient id="panels" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--primary)"/><stop offset="1" style="stop-color:var(--base)"/></linearGradient></defs><path fill="url(#panels)" fill-rule="evenodd" d="M0 0H240V1080H0Z M1680 0H1920V1080H1680Z"/></svg>
<div class="timerBox"><div class="round" id="round">Round 1</div><div class="time" id="time">60:00</div></div><div class="scoreLabel left" id="name1">Player 1</div><div class="scoreLabel right" id="name2">Player 2</div><div class="tracks"><div class="track left" id="track1"></div><div class="goal" id="goal">8</div><div class="track right" id="track2"></div></div><section class="player left"><div class="camera"></div><div class="champion empty" id="legend1"></div><div class="record" id="record1">0-0-0</div><div class="wins"><img class="win" id="win11" src="./riftboundassets/riftboundwin.png" alt="Game win 1"><img class="win" id="win12" src="./riftboundassets/riftboundwin.png" alt="Game win 2"></div><div class="sideBattlefield battlefield empty" id="battlefield1"></div><div class="featuredCard empty" id="regular1"></div></section><section class="player right"><div class="camera"></div><div class="champion empty" id="legend2"></div><div class="record" id="record2">0-0-0</div><div class="wins"><img class="win" id="win21" src="./riftboundassets/riftboundwin.png" alt="Game win 1"><img class="win" id="win22" src="./riftboundassets/riftboundwin.png" alt="Game win 2"></div><div class="sideBattlefield battlefield empty" id="battlefield2"></div><div class="featuredCard empty" id="regular2"></div></section><div class="bottomBrand"><img class="centerLogo" src="./riftboundassets/riftboundlogo.png" alt="Riftbound"></div><div id="connection">Connecting to Riftbound…</div></div></div><script src="./riftboundportraits.js?v=live1"></script><script type="module">
import {regularCard} from './riftboundregularcards.js';
import {watchMatch,watchConnection,getCard,themes,remaining,formatTime} from './riftbounddata.js';
const $=id=>document.getElementById(id),portraits=new Map((window.riftboundPortraits||[]).map(p=>[p.champion,p]));let state=null,online=false,loaded=false,error=false;
function fit(){const scale=Math.min(innerWidth/1920,innerHeight/1080);$('scene').style.transform='translate('+((innerWidth-1920*scale)/2)+'px,'+((innerHeight-1080*scale)/2)+'px) scale('+scale+')';}addEventListener('resize',fit);fit();
function connection(){const el=$('connection');el.hidden=loaded&&online&&!error;el.textContent=error?'Riftbound connection unavailable':loaded?'Reconnecting…':'Connecting to Riftbound…';}
function setCard(p,field,kind){const slot=$(field+p),code=state['player'+p+'_'+field];if(slot.dataset.card===(code||''))return;slot.dataset.card=code||'';slot.replaceChildren();const card=getCard(code,kind);slot.classList.toggle('empty',!card);if(!card)return;const img=document.createElement('img');img.alt=card.name;img.onerror=()=>img.style.visibility='hidden';if(kind==='Legend'){const art=document.createElement('div');art.className='championArt';const portrait=portraits.get(card.champion);if(portrait){art.classList.add('cutout');img.src=portrait.src;art.style.setProperty('--cutout-width',portrait.width);art.style.setProperty('--cutout-left',portrait.left);art.style.setProperty('--cutout-top',portrait.top);}else img.src=card.imageUrl;art.append(img);const label=document.createElement('div');label.className='championName';label.textContent=card.name;slot.append(art,label);}else{img.src=card.imageUrl;slot.append(img);}}
async function setRegular(p,code){const slot=$('regular'+p);if(slot.dataset.card===(code||''))return;slot.dataset.card=code||'';slot.replaceChildren();slot.classList.add('empty');if(!code)return;try{const card=await regularCard(code);if(slot.dataset.card!==code||!card)return;const img=document.createElement('img');img.src=card.imageUrl;img.alt=card.name;img.onerror=()=>{if(slot.dataset.card===code)slot.classList.add('empty');};slot.append(img);slot.classList.remove('empty');}catch{slot.classList.add('empty');}}
for(const p of [1,2])for(let n=0;n<8;n++){const marker=document.createElement('div');marker.className='marker';marker.textContent=n;marker.dataset.point=n;$('track'+p).append(marker);}
function tick(){if(state)$('time').textContent=formatTime(remaining(state));}
function render(s){state=s;const theme=themes.find(t=>t[0]===s.theme)||themes[0];for(const [i,key]of [[2,'--base'],[3,'--primary'],[4,'--accent']])document.documentElement.style.setProperty(key,theme[i]);for(const p of [1,2]){$('name'+p).textContent=s['player'+p+'_name'];$('record'+p).textContent=s['player'+p+'_record'];const track=$('track'+p),points=s['player'+p+'_points'];track.setAttribute('aria-label',s['player'+p+'_name']+': '+points+' points');track.querySelectorAll('.marker').forEach(m=>m.classList.toggle('current',Number(m.dataset.point)===points));for(let w=1;w<=2;w++)$('win'+p+w).classList.toggle('won',s['player'+p+'_wins']>=w);setCard(p,'legend','Legend');setCard(p,'battlefield','Battlefield');setRegular(p,s['player'+p+'_regular']);}$('round').textContent=s.round_name;const finished=[1,2].filter(p=>s['player'+p+'_points']===8).map(p=>s['player'+p+'_name']);$('goal').style.boxShadow=finished.length?'0 0 0 5px #ffe39a66,0 0 35px #ffd568':'0 0 16px #d9b85c55';$('goal').setAttribute('aria-label',finished.length?finished.join(' and ')+' at 8 points':'8 points');tick();}
watchMatch(s=>{loaded=true;error=false;render(s);connection();},()=>{error=true;connection();});watchConnection(value=>{online=value;connection();});setInterval(tick,250);document.addEventListener('visibilitychange',tick);
</script></body></html>
