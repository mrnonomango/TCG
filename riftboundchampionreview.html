<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riftbound Champion Review</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d16;color:#edf5ff;font-family:Arial,sans-serif;padding:28px}header{max-width:1200px;margin:auto}h1{margin:0 0 12px}p{color:#b1c4d8;line-height:1.5}a{color:#69c8ff}input{width:100%;max-width:600px;background:#142336;color:white;border:1px solid #67849d;padding:14px;font-size:18px;border-radius:6px;margin:12px 0 22px}#grid{display:grid;grid-template-columns:repeat(auto-fill,268px);justify-content:center;gap:24px;max-width:1500px;margin:auto}.item{width:268px}.frame{height:132px;width:268px;border:2px solid #cfb579;overflow:hidden;display:flex;flex-direction:column}.art{position:relative;height:98px;flex:none;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#2b536c77,transparent 75%),#0b1522}.art img{position:absolute;height:auto;max-width:none}.name{background:#07101d;border-top:1px solid #cfb57977;flex:1;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold}.detail{color:#93abc2;font-size:12px;line-height:1.4;margin-top:7px}.item button{margin-top:8px;background:#18364d;border:1px solid #5f94b8;border-radius:5px;color:white;padding:8px;cursor:pointer}
button{background:#18364d;border:1px solid #5f94b8;border-radius:5px;color:white;padding:9px 14px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.pager{display:flex;gap:10px;margin-bottom:22px}@media(max-width:500px){body{padding:20px}}
</style></head><body><header><h1>Riftbound Champion Review</h1><p>One portrait per champion, shown in the overlay’s compact banner. Tell me the champion names that need adjusting.</p><a href="./riftboundpreview.html">Back to overlay preview</a><br><input id="search" type="search" placeholder="Find a champion…" aria-label="Find a champion"><p id="count"></p><div class="pager"><button id="previous">Previous</button><button id="next">Next</button></div></header><main id="grid"></main><script src="./riftboundportraits.js?v=legends1"></script><script>
const portraits=window.riftboundPortraits||[];
let page=0;const pageSize=12;
function render(){const term=document.getElementById('search').value.trim().toLowerCase();const list=portraits.filter(p=>p.champion.toLowerCase().includes(term));const pages=Math.max(1,Math.ceil(list.length/pageSize));page=Math.min(page,pages-1);document.getElementById('previous').disabled=page===0;document.getElementById('next').disabled=page>=pages-1;const grid=document.getElementById('grid');grid.replaceChildren();document.getElementById('count').textContent=list.length+' champions · Page '+(page+1)+' of '+pages;for(const p of list.slice(page*pageSize,(page+1)*pageSize)){const item=document.createElement('article');item.className='item';const frame=document.createElement('div');frame.className='frame';const art=document.createElement('div');art.className='art';const img=document.createElement('img');img.src=p.src;img.alt=p.champion;img.loading='lazy';img.style.width=p.width;img.style.left=p.left;img.style.top=p.top;art.append(img);const name=document.createElement('div');name.className='name';name.textContent=p.champion;frame.append(art,name);const detail=document.createElement('div');detail.className='detail';detail.textContent='Legend: '+p.name+' · '+p.code;const button=document.createElement('button');button.textContent='Try in overlay';button.onclick=()=>{let selected=['SFD-057','OGN-202','OGN-282','OGN-298'];try{const saved=JSON.parse(localStorage.getItem('tcgRiftboundPreviewCards'));if(Array.isArray(saved)&&saved.length===4)selected=saved;}catch{}selected[0]=p.code;try{localStorage.setItem('tcgRiftboundPreviewCards',JSON.stringify(selected));}catch{}location.href='./riftboundpreview.html';};item.append(frame,detail,button);grid.append(item);}}
document.getElementById('previous').onclick=()=>{page=Math.max(0,page-1);render();};document.getElementById('next').onclick=()=>{page++;render();};document.getElementById('search').addEventListener('input',()=>{page=0;render();});render();
</script></body></html>
